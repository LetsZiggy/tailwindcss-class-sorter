#$schema: 'https://golangci-lint.run/jsonschema/golangci.jsonschema.json'

version: '2'

linters:
  default: 'all'
  disable:
    - 'arangolint'
    - 'clickhouselint'
    - 'cyclop'
    - 'depguard'
    - 'ginkgolinter'
    - 'gocognit'
    - 'gocyclo'
    - 'goheader' # TODO
    - 'gomodguard' # Deprecated
    - 'gomodguard_v2'
    - 'lll'
    - 'loggercheck' # TODO
    - 'maintidx'
    - 'noinlineerr'
    - 'prealloc' # TODO
    - 'promlinter'
    - 'spancheck'
    - 'testifylint'
    - 'wsl' # Deprecated
  settings:
    bodyclose:
      check-consumption: true
    copyloopvar:
      check-alias: true
    decorder:
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: false
    dupword:
      keywords: ['the', 'and', 'a']
    embeddedstructfieldcheck:
      forbid-mutex: true
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true
      verbose: true
    errchkjson:
      check-error-free-encoding: true
    exhaustive:
      check: ['switch', 'map']
      default-signifies-exhaustive: true
      default-case-required: true
    exhaustruct:
      allow-empty: true
      allow-empty-returns: true
      allow-empty-declarations: true
    fatcontext:
      check-struct-pointers: true
    forbidigo:
      analyze-types: true
    funcorder:
      function: true
    funlen:
      lines: -1
      statements: -1
    gochecksumtype:
      include-shared-interfaces: true
    goconst:
      find-duplicates: true
      eval-const-expressions: true
    gocritic:
      enable-all: true
      disabled-checks: ['commentedOutCode', 'ruleguard']
      settings:
        captLocal:
          paramsOnly: false
        rangeExprCopy:
          skipTestFuncs: false
        rangeValCopy:
          sizeThreshold: 128
          skipTestFuncs: false
        truncateCmp:
          skipArchDependent: false
        unnamedResult:
          checkExported: true
    godoclint:
      default: 'all'
      options:
        max-len:
          length: 127
    godot:
      exclude: ['^FIXME:', '^fixme:', '^TODO:', '^todo:']
      period: false
    godox:
      keywords: ['BUG', 'bug', 'FIXME', 'fixme', 'TODO', 'todo']
    gomoddirectives:
      replace-local: true
      toolchain-pattern: 'go\d\.\d+\.\d+$'
      go-version-pattern: '\d\.\d+(\.0)?'
      check-module-path: true
    gosmopolitan:
      allow-time-local: true
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    grouper:
      const-require-single-const: true
      const-require-grouping: true
      import-require-single-import: true
      import-require-grouping: true
      type-require-single-type: true
      type-require-grouping: true
      var-require-single-var: true
      var-require-grouping: true
    ineffassign:
      check-escaping-errors: true
    makezero:
      always: true
    misspell:
      locale: 'US'
    nlreturn:
      block-size: 2
    revive:
      enable-all-rules: true
      enable-default-rules: true
      rules:
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#line-length-limit
        - name: line-length-limit
          severity: warning
          disabled: false
          exclude: ['']
          arguments: [127]
    sloglint:
      no-global: 'all'
      context: 'all'
      msg-style: 'lowercased'
      key-naming-case: 'snake'
    staticcheck:
      dot-import-whitelist: []
      checks: ['all', '-ST1000', '-ST1003', '-ST1016', '-ST1020', '-ST1021', '-ST1022', '-ST1023'] # Added: '-ST1023'
    tagalign:
      strict: true
    unused:
      field-writes-are-uses: false
      exported-fields-are-used: false
      parameters-are-used: false
      local-variables-are-used: false
      generated-is-used: false
    wsl_v5:
      default: 'all'
