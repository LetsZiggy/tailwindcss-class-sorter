#$schema: 'https://golangci-lint.run/jsonschema/golangci.jsonschema.json'

version: '2'

linters:
  default: 'all'
  disable:
    - 'arangolint'
    - 'clickhouselint'
    - 'cyclop'
    - 'depguard'
    - 'ginkgolinter'
    - 'gocognit'
    - 'gocyclo'
    - 'goheader' # TODO
    - 'gomodguard' # Deprecated
    - 'gomodguard_v2'
    - 'lll'
    - 'loggercheck' # TODO
    - 'maintidx'
    - 'noinlineerr'
    - 'prealloc' # TODO
    - 'promlinter'
    - 'spancheck'
    - 'testifylint'
    - 'wsl' # Deprecated
  settings:
    bodyclose:
      check-consumption: true
    copyloopvar:
      check-alias: true
    decorder:
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: false
    dupword:
      keywords: ['the', 'and', 'a']
    embeddedstructfieldcheck:
      forbid-mutex: true
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true
      verbose: true
    exhaustive:
      check: ['switch', 'map']
      default-signifies-exhaustive: true
      default-case-required: true
    exhaustruct:
      allow-empty: true
      allow-empty-returns: true
      allow-empty-declarations: true
    fatcontext:
      check-struct-pointers: true
    funcorder:
      function: true
    funlen:
      lines: -1
      statements: -1
    gochecksumtype:
      include-shared-interfaces: true
    goconst:
      min-len: 999
      min-occurrences: 999
    gocritic:
      enable-all: true
      disabled-checks: ['commentedOutCode', 'ruleguard']
      settings:
        captLocal:
          paramsOnly: false
        rangeExprCopy:
          skipTestFuncs: false
        rangeValCopy:
          sizeThreshold: 128
          skipTestFuncs: false
        truncateCmp:
          skipArchDependent: false
        unnamedResult:
          checkExported: true
    godoclint:
      default: 'all'
      disable: ['pkg-doc', 'single-pkg-doc', 'require-pkg-doc']
      options:
        max-len:
          length: 127
    godot:
      exclude: ['^FIXME:', '^fixme:', '^TODO:', '^todo:']
      period: false
    godox:
      keywords: ['BUG', 'bug', 'FIXME', 'fixme', 'TODO', 'todo']
    gomoddirectives:
      replace-local: true
      toolchain-pattern: 'go\d\.\d+\.\d+$'
      go-version-pattern: '\d\.\d+(\.0)?'
      check-module-path: true
    gosmopolitan:
      allow-time-local: true
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    grouper:
      const-require-single-const: true
      const-require-grouping: true
      import-require-single-import: true
      import-require-grouping: true
      type-require-single-type: true
      type-require-grouping: true
      var-require-single-var: true
      var-require-grouping: true
    ineffassign:
      check-escaping-errors: true
    makezero:
      always: true
    misspell:
      locale: 'US'
    mnd:
      ignored-numbers: ['0o600', '2', '3', '5', '75', '80', '100', '100000']
    nestif:
      min-complexity: 999
    nlreturn:
      block-size: 2
    revive:
      max-open-files: 0
      enable-all-rules: true
      enable-default-rules: true
      rules:
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#add-constant
        - name: add-constant
          severity: warning
          disabled: true
          exclude: []
          arguments:
            - max-lit-count: '3'
              allow-strs: '""'
              allow-ints: '0,1,2'
              allow-floats: '0.0,0.,1.0,1.,2.0,2.'
              ignore-funcs: 'os\\.*,fmt\\.Println,make'
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#argument-limit
        - name: argument-limit
          severity: warning
          disabled: true
          exclude: []
          arguments: [8]
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#cognitive-complexity
        - name: cognitive-complexity
          severity: warning
          disabled: true
          exclude: []
          arguments: [7]
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#cyclomatic
        - name: cyclomatic
          severity: warning
          disabled: true
          exclude: []
          arguments: [10]
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#flag-parameter
        - name: flag-parameter
          severity: warning
          disabled: true
          exclude: []
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#function-length
        - name: function-length
          severity: warning
          disabled: true
          exclude: []
          arguments: [50, 75]
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#function-result-limit
        - name: function-result-limit
          severity: warning
          disabled: true
          exclude: []
          arguments: [3]
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#line-length-limit
        - name: line-length-limit
          severity: warning
          disabled: true
          exclude: []
          arguments: [80]
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#max-public-structs
        - name: max-public-structs
          severity: warning
          disabled: true
          exclude: []
          arguments: [5]
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#package-comments
        - name: package-comments
          severity: warning
          disabled: true
          exclude: []
    sloglint:
      no-global: 'all'
      context: 'all'
      msg-style: 'lowercased'
      key-naming-case: 'snake'
    staticcheck:
      dot-import-whitelist: []
      checks: ['all', '-ST1000', '-ST1003', '-ST1016', '-ST1020', '-ST1021', '-ST1022', '-ST1023'] # Added: '-ST1023'
    tagalign:
      align: true
      sort: true
      order: ['json', 'yaml', 'yml', 'toml', 'mapstructure', 'binding', 'validate', 'options', 'default']
      strict: true
    tagliatelle:
      case:
        rules:
          json: snake
    unused:
      field-writes-are-uses: false
      exported-fields-are-used: false
      parameters-are-used: false
      local-variables-are-used: false
      generated-is-used: false
    varnamelen:
      min-name-length: 1
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: true
      case-max-lines: 0
      default: 'all'
